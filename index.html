<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<style>
.title{
  color:#7dd3fc;
  font-weight:700;

}

body{
  background:#0b141a;
  color:#e6edf3;
  font-family:sans-serif;
  padding-top:48px;
  padding-bottom:18px;
}

/* tabs */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:10px;
  overflow-x:auto;
}

.tab-btn{
  flex:1;
  padding:12px 4px;
  text-align:center;
  border-radius:10px;
  background:#1b2a32;
  font-weight:700;
  font-size:15px;
  color:#cfe6ee;
}

.tab-btn.active{
  background:#144d57;
  color:#fff;
}

.tab{display:none}
.tab.active{display:block}

.app-tabs{
  display:flex;
  gap:8px;
  margin:0 0 12px;
  padding:4px;
  border:1px solid #22343c;
  border-radius:14px;
  background:#0f1a20;
}

.app-tab-btn{
  flex:1;
  height:42px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:#8fa6ad;
  font-size:13px;
}

.app-tab-btn.active{
  color:#fff;
  background:#144d57;
  border-color:#287482;
  box-shadow:0 4px 12px rgba(20,77,87,.28);
}

.g-tab-title{
  color:#7dd3fc;
  font-size:16px;

  text-align:center;

}

.g-dan-actions{display:flex;gap:7px;margin-top:7px}
.g-dan-actions button{height:38px;min-height:38px;padding:6px 8px;border-radius:10px;font-size:12px}
.g-result-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.g-result-actions button{display:flex;align-items:center;justify-content:center;text-align:center;height:40px;min-height:40px;padding:6px 8px;border-radius:10px;font-size:12px}

.gx-section-title{color:#7dd3fc;font-size:16px;font-weight:800;text-align:center;margin:8px 0 12px}
.gx-result{min-height:70px;white-space:pre-wrap;text-align:center;font-weight:800;color:#22c55e;line-height:1.6;word-break:break-word}
.gx-result-actions{display:flex;gap:7px;margin-top:7px}
.gx-result-actions button{height:38px;min-height:38px;padding:6px 8px;border-radius:10px;font-size:12px}

.gx-xien-buttons button.active{background:#287482;color:#fff;border-color:#7dd3fc}
.gx-action{height:40px;min-height:40px;font-size:13px}

.theme-menu-btn{
  position:fixed;
  z-index:10001;
  top:max(8px,env(safe-area-inset-top));
  right:8px;
  width:32px;
  height:32px;
  min-height:32px;
  padding:0;
  flex:none;
  border:1px solid #2a4650;
  border-radius:9px;
  background:#14262e;
  color:#d7f7ff;
  box-shadow:0 8px 20px rgba(0,0,0,.28);
}
.theme-menu-btn span,.theme-menu-btn span:before,.theme-menu-btn span:after{
  display:block;width:15px;height:2px;margin:auto;border-radius:2px;background:currentColor;content:''
}
.theme-menu-btn span:before{transform:translateY(-6px)}
.theme-menu-btn span:after{transform:translateY(4px)}
.theme-overlay{position:fixed;inset:0;z-index:10000;display:none;background:rgba(2,8,12,.76);backdrop-filter:blur(12px);padding:18px 14px;overflow:auto}
.theme-overlay.open{display:block}
.theme-sheet{width:min(680px,100%);min-height:100%;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom))}
.theme-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;color:#fff}
.theme-head strong{font-size:20px;letter-spacing:.5px}
.theme-close{width:40px;height:40px;min-height:40px;flex:none;padding:0;background:#263b43;color:#fff;border-radius:12px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme-choice{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px;border:1px solid #34505a;border-radius:15px;background:#12232a;color:#e8f8fb;text-align:left}
.theme-choice.active{border-color:#7dd3fc;box-shadow:0 0 0 2px #7dd3fc55}
.theme-swatch{width:38px;height:38px;flex:none;border-radius:11px;border:2px solid #ffffff55;box-shadow:inset 0 0 0 5px #00000012}
.theme-choice b{display:block;font-size:13px}.theme-choice small{display:block;margin-top:3px;color:#9bb4bd;font-size:10px}

body.theme-sky{--t-bg:#eaf5ff;--t-panel:#ffffff;--t-input:#f5fbff;--t-border:#c9e1f5;--t-text:#173958;--t-muted:#5c7b97;--t-accent:#208be0}

body.theme-lavender{--t-bg:#f6f1ff;--t-panel:#ffffff;--t-input:#fbf9ff;--t-border:#e0d4f5;--t-text:#382957;--t-muted:#796d91;--t-accent:#7657d8}
body.theme-sand{--t-bg:#fff8ed;--t-panel:#ffffff;--t-input:#fffdf8;--t-border:#f0dcc0;--t-text:#503a25;--t-muted:#987b5b;--t-accent:#c47b21}
body[class*="theme-"]{background:var(--t-bg);color:var(--t-text)}
body[class*="theme-"] .box{background:var(--t-panel);border-color:var(--t-border);color:var(--t-text)}

body[class*="theme-"] .app-tabs{background:var(--t-panel);border-color:var(--t-border)}
body[class*="theme-"] .app-tab-btn{color:var(--t-muted)}
body[class*="theme-"] .app-tab-btn.active{background:var(--t-accent);border-color:var(--t-accent);color:#fff}
body[class*="theme-"] .theme-menu-btn{background:var(--t-panel);border-color:var(--t-border);color:var(--t-text)}
body[class*="theme-"] .num-pad{background:var(--t-panel);border-color:var(--t-border)}
body[class*="theme-"] .num-pad button{background:var(--t-input);border-color:var(--t-border);color:var(--t-text)}
body[class*="theme-"] .num-pad button:active{background:var(--t-accent)}

/* box */

.box{
  background:#111b21;
  border:1px solid #22343c;
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}

/* inputs layout */

.inputs{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

/* input + textarea */

input,textarea{
  width:100%;
  height:52px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #2a3f47;
  background:#0b141a;
  color:#e6edf3;
  font-size:17px;
  font-weight:700;
  text-align:center;
  box-sizing:border-box;
}

input{
  -webkit-appearance:none;
  appearance:none;
  caret-color:#7dd3fc;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}

input:focus,textarea:focus{
  outline:none;
  border-color:#22c5d6;
  background:#0d1c23;
  box-shadow:0 0 0 3px rgba(34,197,214,.16);
}

input::placeholder,textarea::placeholder{
  color:#78919a;
  opacity:1;
}

.num-pad{
  position:fixed;
  z-index:9999;
  left:50%;
  right:auto;
  bottom:12px;
  width:min(calc(100vw - 20px),420px);
  transform:translateX(-50%);
  display:none;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  padding:12px;
  background:linear-gradient(145deg,#14252d,#0d171c);
  border:1px solid rgba(125,211,252,.24);
  border-radius:22px;
  box-shadow:0 16px 40px rgba(0,0,0,.62),0 0 24px rgba(34,197,214,.08);
  backdrop-filter:blur(16px);
}

.num-pad.open{display:grid}

.num-pad::before{
  content:'';
  grid-column:1/-1;
  width:42px;
  height:4px;
  margin:0 auto 2px;
  border-radius:99px;
  background:#46646d;
}

.pad-title{
  grid-column:1/-1;
  padding:0 2px 2px;
  color:#8faeb7;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  text-align:center;
}

.pad-paste{
  grid-column:1/-1;
  height:38px !important;
  min-height:38px !important;
  color:#9ed9e6 !important;
  font-size:15px !important;
}

.num-pad button{
  flex:none;
  height:54px;
  border:1px solid rgba(125,211,252,.13);
  border-radius:15px;
  background:linear-gradient(145deg,#1d3943,#142a32);
  color:#e6edf3;
  font-size:22px;
  font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 7px rgba(0,0,0,.18);
  -webkit-tap-highlight-color:transparent;
}

.num-pad button:active{
  background:#1f8a99;
  transform:scale(.97);
}

.num-pad .pad-action{
  color:#9ed9e6;
  font-size:18px;
  background:linear-gradient(145deg,#193842,#122a31);
}

.num-pad .pad-done{
  background:linear-gradient(145deg,#193842,#122a31);
  color:#9ed9e6;
  border-color:rgba(125,211,252,.13);
  font-size:16px;
}

textarea{
  height:58px;
  resize:none;
}

/* result */

.result{
  word-break:break-word;
  font-weight:800;
  color:#22c55e;
  margin-top:6px;
}
textarea[id*="kq"],
#ghep_kq,
#xien_result {
  color:#22c55e;
  font-weight:800;
  letter-spacing:1px;
}
.count{
  font-size:13px;
  color:#8fa6ad;
  text-align:center;
}

/* buttons */

.actions{
  display:none;
  gap:8px;
  margin-top:8px;
}

button{
  flex:1;
  height:48px;
  border:none;
  border-radius:12px;
  font-weight:700;
  font-size:15px;
}

.copy{
  background:#1f8a99;
  color:#fff;
}

.del{
  background:#7a2e2e;
  color:#fff;
}
</style>

<body>

<div class="container">

<div class="app-tabs">
  <button type="button" class="app-tab-btn active" data-tab="tab1" onclick="switchAppTab('tab1',this)">TẠO DÀN</button>
  <button type="button" class="app-tab-btn" data-tab="tab2" onclick="switchAppTab('tab2',this)">GHÉP TRÙNG</button>
  <button type="button" class="app-tab-btn" data-tab="tab3" title="GHÉP 3D-4D + XIÊN" onclick="switchAppTab('tab3',this)">GHÉP 3D</button>
</div>

<div id="tab1" class="tab active">
<div class="title">TẠO DÀN VIP</div>
</div>
<div id="tab2" class="tab"></div>
<div id="tab3" class="tab"></div>
<script>
const MIN=1, MAX=1
const ALL_NUMS = Array.from({length:100},(_,i)=>i.toString().padStart(2,'0'))
const KEY='tool_lo1_fix'
let isLoading = false
const inputOrder = {}
const lastInputValues = {}

function rememberInput(i){
  const el = document.activeElement
  if(!el || !el.id || !el.closest('#b1_'+i)) return
  if(lastInputValues[el.id] === el.value) return

  lastInputValues[el.id] = el.value
  inputOrder[i] = (inputOrder[i] || []).filter(id => id !== el.id)

  if(el.value.trim() !== ''){
    inputOrder[i].push(el.id)
  }
}

function save(){

  if(isLoading) return

  const d = {}

  document.querySelectorAll('#tab1 input,#tab1 textarea').forEach(e=>{
    if(e.id) d[e.id] = e.value
  })

  try{
    localStorage.setItem(KEY, JSON.stringify(d))
  }catch(e){
    console.warn('Không thể lưu dữ liệu:', e)
  }
}
function load(){

  isLoading = true

  let d = {}

  try{
    d = JSON.parse(localStorage.getItem(KEY) || '{}')
  }catch(e){
    console.warn('Dữ liệu đã lưu bị lỗi, bỏ qua dữ liệu cũ:', e)
    try{
      localStorage.removeItem(KEY)
    }catch(removeError){
      console.warn('Không thể xoá dữ liệu lỗi:', removeError)
    }
  }

  if(!d || typeof d !== 'object' || Array.isArray(d)) d = {}

  Object.keys(d).forEach(id=>{
    const e = document.getElementById(id)
    if(!e) return
    if(!e.closest('#tab1')) return

    if(e.tagName === 'INPUT' || e.tagName === 'TEXTAREA'){
      e.value = d[id]
    }
  })

  setTimeout(()=>{
    for(let i=1;i<=MAX;i++){
      calc1(i)
    }
    isLoading = false
  },50)
}

function copyText(text){
  if(!navigator.clipboard || !window.isSecureContext){
    alert('Không thể copy trong môi trường hiện tại. Hãy mở bằng HTTPS hoặc localhost.')
    return
  }

  navigator.clipboard.writeText(text).catch(e=>{
    console.warn('Không thể copy:', e)
    alert('Không thể copy. Hãy kiểm tra quyền clipboard của trình duyệt.')
  })
}
/* TOOL */
const digits=id=>{
  const el=document.getElementById(id)
  if(!el) return []
  return (el.value||'')
    .replace(/\D/g,'')
    .split('')
    .map(Number)
}
const pairs = id=>{
  const el = document.getElementById(id)
  if(!el) return []

  const nums = (el.value || "")
    .replace(/\D/g,"")
    .match(/\d{2}/g) || []

  return [...new Set(nums)]
}
/* ================= TAB 1 – TẠO DÀN VIP ================= */
function gen(ch,tg,dau,duoi){
  return ALL_NUMS.filter(num=>{
    const a = +num[0]
    const b = +num[1]

    if(ch.length && !(ch.includes(a)||ch.includes(b))) return false
    if(tg.length && !tg.includes((a+b)%10)) return false
    if(dau.length && !dau.includes(a)) return false
    if(duoi.length && !duoi.includes(b)) return false

    return true
  })
}

function calc1(i){

  rememberInput(i)

  const a = digits('a'+i)
  const b = digits('b'+i)

  const ch = digits('ch'+i)
  const to = digits('to'+i)
  const bo = pairs('bo'+i)

  const da = digits('da'+i)
  const du = digits('du'+i)

  const add = pairs('add'+i)
  const sub = pairs('sub'+i)

  const locham = digits('locham'+i)
  const lotong = digits('lotong'+i)
  const lobo = pairs('lobo'+i)

  const lodau = digits('lodau'+i)
  const loduoi = digits('loduoi'+i)
  const addch = digits('addch'+i)
  const addto = digits('addto'+i)
  const addbo = pairs('addbo'+i)

const adddau = digits('adddau'+i)
const addduoi = digits('addduoi'+i)
const ghepcham = digits('ghepcham'+i)
const ghepto   = digits('ghepto'+i)
const gheptrong = digits('gheptrong'+i)
const ghepngoai = digits('ghepngoai'+i)
  const hasMainFilter =
  a.length || b.length ||
  ch.length || to.length || bo.length ||
  da.length || du.length

  const hasLoFilter =
  locham.length || lotong.length || lobo.length ||
  lodau.length || loduoi.length

  const hasAddFilter =
  addch.length || addto.length || addbo.length ||
  adddau.length || addduoi.length

  const addIds = ['add'+i,'addch'+i,'addto'+i,'addbo'+i,'adddau'+i,'addduoi'+i]
  const loIds = ['locham'+i,'lotong'+i,'lobo'+i,'lodau'+i,'loduoi'+i]
  const order = inputOrder[i] || []
  const relevant = order.filter(id => addIds.includes(id) || loIds.includes(id))
  const firstAction = relevant[0] || ''
  const lastAction = relevant[relevant.length-1] || ''
  const addWasFirst = addIds.includes(firstAction)
  const loWasLast = loIds.includes(lastAction)

  const addSet = add.length
    ? [...new Set(add.map(x => String(x).padStart(2,'0')))]
    : []

  // Nhập gì ở các ô LOẠI thì loại đúng điều kiện đó khỏi toàn bộ dàn.
  const isExcluded = n => {
    const x = +n[0]
    const y = +n[1]

    if(lodau.length && lodau.includes(x)) return true
    if(loduoi.length && loduoi.includes(y)) return true
    if(locham.length && (locham.includes(x)||locham.includes(y))) return true
    if(lotong.length && lotong.includes((x+y)%10)) return true

    if(lobo.length){
      const bong = d => (d <= 4) ? String(+d + 5) : String(+d - 5)
      for(let pair of lobo){
        const p=pair[0], q=pair[1]
        const set=[
          p+q,q+p,
          bong(p)+bong(q),bong(q)+bong(p),
          p+bong(q),bong(q)+p,
          q+bong(p),bong(p)+q
        ]
        if(set.includes(n)) return true
      }
    }

    return false
  }

  let base = []

  // Bộ lọc chính và Loại dùng dàn nền 100 số.
  // Các ô Thêm chỉ hợp thêm, không làm thay thế hoặc lọc giao dàn nền.
  if(hasMainFilter || (!addWasFirst && (hasLoFilter || (!hasAddFilter && !addSet.length && sub.length)))){
    base = [...ALL_NUMS]
  }
  // ===== FILTER FUNCTION =====
const pass = (n)=>{

  // Chỉ nhập A hoặc chỉ nhập B thì không sinh dàn
  if((a.length && !b.length) || (!a.length && b.length)){
    return false
  }

  const x = +n[0]
  const y = +n[1]

    // ===== A / B =====

// có cả A và B → ghép cặp
if(a.length && b.length){
  let ok = false

  for(let A of a){
    for(let B of b){
      if(n === `${A}${B}` || n === `${B}${A}`){
        ok = true
        break
      }
    }
    if(ok) break
  }

  if(!ok) return false
}

    if(ch.length && !(ch.includes(x)||ch.includes(y))) return false
    if(to.length && !to.includes((x+y)%10)) return false

    if(da.length && !da.includes(x)) return false
    if(du.length && !du.includes(y)) return false

    return true
  }

  // ===== APPLY FILTER =====
  let r = base.filter(pass)

  // ===== BỘ =====
  if(bo.length){
    const bong = d => (d <= 4) ? String(+d + 5) : String(+d - 5)

    r = r.filter(n=>{
      return bo.some(b=>{
        const a=b[0], c=b[1]
        const set=[
          a+c,c+a,
          bong(a)+bong(c),bong(c)+bong(a),
          a+bong(c),bong(c)+a,
          c+bong(a),bong(a)+c
        ]
        return set.includes(n)
      })
    })
  }

  // Loại trước dàn nền; số được Thêm sau đó không bị Loại chặn lại.
  r = r.filter(n => !isExcluded(n))

  // ===== THÊM: LUÔN HỢP VÀO DÀN HIỆN CÓ =====
  const mergeAdded = values => {
    r = [...new Set([...r, ...values])]
  }

if(addSet.length){
  // Số nhập ở ô Thêm qua bộ lọc chính, không qua Loại.
  mergeAdded(addSet.filter(n => pass(n)))
}

// ===== THÊM THEO ĐIỀU KIỆN: HỢP VÀO DÀN HIỆN CÓ =====

function parseG(text){
  const output=[]
  const runs=String(text||'').match(/\d+/g)||[]
  for(const run of runs){
    if(run.length>=2 && run.length<=4) output.push(run)
    else if(run.length>4 && run.length%2===0){
      for(let i=0;i<run.length;i+=2) output.push(run.slice(i,i+2))
    }
  }
  return [...new Set(output)]
}

function getFilledG(){
  const filled=[]
  for(let i=1;i<=G_MAX;i++){
    const field=document.getElementById('g'+i)
    if(!field) continue
    const nums=parseG(field.value)
    if(nums.length) filled.push({index:i,nums})
  }
  return filled
}

function autoResizeG(field){
  field.style.height='58px'
  if(field.value.trim()) field.style.height=Math.min(140,Math.max(58,field.scrollHeight))+'px'
}

function autoG(){
  if(!document.getElementById('tab2')) return
  let last=0
  for(let i=1;i<=G_MAX;i++){
    const field=document.getElementById('g'+i)
    if(field && field.value.trim()) last=i
  }
  const visibleThrough=Math.min(G_MAX,Math.max(1,last+1))
  for(let i=1;i<=G_MAX;i++){
    const box=document.getElementById('gbox'+i)
    if(box) box.style.display=i<=visibleThrough?'block':'none'
  }
}

function onGInput(field){
  autoResizeG(field)
  gMode={type:'intersection'}
  calcG()
}

function showGResult(numbers,mode){
  const sorted=[...new Set(numbers)].sort((a,b)=>Number(a)-Number(b))
  document.getElementById('gr').innerText=sorted.join(',')
  document.getElementById('gc').innerText=sorted.length?sorted.length+' số':''
  document.getElementById('gact').style.display=sorted.length?'grid':'none'
  gMode=mode
  generateGDiff()
  saveG()
}

function calcG(){
  const filled=getFilledG(); autoG()
  if(filled.length<2){
    document.getElementById('gr').innerText=''
    document.getElementById('gc').innerText=''
    document.getElementById('gact').style.display='none'
    generateGDiff(); saveG(); return
  }
  let common=new Set(filled[0].nums)
  for(const dan of filled.slice(1)){
    const next=new Set(dan.nums)
    common=new Set([...common].filter(number=>next.has(number)))
  }
  showGResult([...common],{type:'intersection'})
}

function calcUnion(){
  const all=new Set(getFilledG().flatMap(dan=>dan.nums))
  showGResult([...all],{type:'union'})
}

function removeAllDuplicate(){
  const occurrences=new Map()
  for(const dan of getFilledG()) for(const number of dan.nums){
    occurrences.set(number,(occurrences.get(number)||0)+1)
  }
  showGResult([...occurrences].filter(([,count])=>count===1).map(([number])=>number),{type:'unique'})
}

function generateGDiff(){
  const host=document.getElementById('gdiff'); if(!host) return
  host.replaceChildren()
  const filled=getFilledG(); if(filled.length<2) return
  const [a,b]=filled
  for(const [left,right] of [[a,b],[b,a]]){
    const button=document.createElement('button')
    button.type='button'; button.textContent=`Dàn ${left.index} loại dàn ${right.index}`
    button.onclick=()=>diffG(left.index,right.index)
    host.appendChild(button)
  }
}

function diffG(a,b){
  const first=parseG(document.getElementById('g'+a).value)
  const second=new Set(parseG(document.getElementById('g'+b).value))
  showGResult(first.filter(number=>!second.has(number)),{type:'difference',a,b})
}

async function pasteG(index){
  try{
    if(!navigator.clipboard || !navigator.clipboard.readText) throw new Error('clipboard')
    document.getElementById('g'+index).value=parseG(await navigator.clipboard.readText()).join(',')
    onGInput(document.getElementById('g'+index))
  }catch(e){
    document.getElementById('gnotice').innerText='Không đọc được clipboard. Hãy dán trực tiếp vào ô.'
  }
}

function copyGResult(){
  const text=document.getElementById('gr').innerText
  if(text) copyText(text)
}

function clearDan(index){
  const field=document.getElementById('g'+index)
  field.value=''; autoResizeG(field); calcG()
}

function clearG(){
  for(let i=1;i<=G_MAX;i++){
    const field=document.getElementById('g'+i)
    if(field){field.value='';autoResizeG(field)}
  }
  document.getElementById('gr').innerText=''
  document.getElementById('gc').innerText=''
  document.getElementById('gact').style.display='none'
  autoG(); saveG()
}

function saveG(){
  if(gLoading) return
  const state={inputs:{},mode:gMode}
  for(let i=1;i<=G_MAX;i++){
    const field=document.getElementById('g'+i)
    if(field) state.inputs['g'+i]=field.value
  }
  try{localStorage.setItem(G_KEY,JSON.stringify(state))}catch(e){console.warn('Không thể lưu tab Ghép Trùng:',e)}
}

function loadG(){
  gLoading=true
  let state=null
  try{state=JSON.parse(localStorage.getItem(G_KEY)||'null')}catch(e){state=null}
  const inputs=state&&state.inputs?state.inputs:state
  if(inputs&&typeof inputs==='object'){
    for(let i=1;i<=G_MAX;i++){
      const field=document.getElementById('g'+i)
      if(field&&typeof inputs['g'+i]==='string'){field.value=inputs['g'+i];autoResizeG(field)}
    }
  }
  autoG(); gLoading=false
  const mode=state&&state.mode&&typeof state.mode.type==='string'?state.mode:{type:'intersection'}
  if(mode.type==='union') calcUnion()
  else if(mode.type==='unique') removeAllDuplicate()
  else if(mode.type==='difference'&&Number.isInteger(mode.a)&&Number.isInteger(mode.b)) diffG(mode.a,mode.b)
  else calcG()
}

function parseGXParts(text){
  const out=[]
  const runs=String(text||'').match(/\d+/g)||[]
  for(const run of runs){
    if(run.length>=2 && run.length<=4) out.push(run)
    else if(run.length>4 && run.length%2===0){
      for(let i=0;i<run.length;i+=2) out.push(run.slice(i,i+2))
    }
  }
  return [...new Set(out)]
}

function gxDigits(id){
  return [...new Set((document.getElementById(id).value||'').replace(/\D/g,'').split('').filter(Boolean))]
}

function calcGX(){
  const parts=parseGXParts(document.getElementById('gxDan').value)
  const d2=parts.filter(x=>x.length===2)
  const d3=parts.filter(x=>x.length===3)
  const c3=gxDigits('gxCang3')
  const c4=gxDigits('gxCang4')
  // 3D luôn phải đủ đúng 3 chữ số: Càng 3D + dàn 2D.
  const result3=[...new Set(c3.flatMap(c=>d2.map(n=>c+n)))].filter(n=>n.length===3)
  // 4D luôn phải ghép đủ 4 chữ số: Càng 4D + một số 3D hoàn chỉnh.
  const base3=[...new Set([...d3,...result3])]
  const result4=[...new Set(c4.flatMap(c=>base3.map(n=>c+n)))].filter(n=>n.length===4)
  // Một kết quả chỉ dùng một loại: có Càng 4D thì chỉ hiện 4D, ngược lại chỉ hiện 3D.
  const result=(c4.length ? result4 : result3).sort((a,b)=>Number(a)-Number(b))
  document.getElementById('gxResult').innerText=result.join(',')
  document.getElementById('gxCount').innerText=result.length?result.length+' số':''
  saveGX()
}

function gxCombinations(items,size){
  const result=[]
  const walk=(start,chosen)=>{
    if(chosen.length===size){result.push(chosen.join('-'));return}
    for(let i=start;i<=items.length-(size-chosen.length);i++) walk(i+1,[...chosen,items[i]])
  }
  if(size<=items.length) walk(0,[])
  return result
}

function calcGXXien(size){
  gxXienSize=size
  document.querySelectorAll('#tab3 .gx-xien-buttons button').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.size)===size))
  const nums=[...new Set(parseGXParts(document.getElementById('gxXienDan').value).filter(x=>x.length===2))]
  const result=gxCombinations(nums,size)
  document.getElementById('gxXienResult').innerText=result.join(',')
  document.getElementById('gxXienCount').innerText=result.length?result.length+' xiên':''
  saveGX()
}

    document.getElementById('gxDan').value=''

  }
}

  pad.className = 'num-pad'
  pad.innerHTML = `
    <div class="pad-title">BÀN PHÍM SỐ</div>
    <button type="button" id="padPaste" class="pad-action pad-paste" data-action="paste" style="display:none">DÁN</button>
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" class="pad-action pad-done" data-action="done">Xong</button>
    <button type="button" data-key="0">0</button>
    <button type="button" class="pad-action" data-action="backspace">⌫</button>
  `
  document.body.appendChild(pad)

  let activeInput = null

  const closePad = () => {
    activeInput = null
    pad.classList.remove('open')
  }

  const emitInput = () => {
    if(!activeInput) return
    activeInput.dispatchEvent(new Event('input',{bubbles:true}))
  }

  const updatePasteButton = () => {
    const allowed = activeInput && activeInput.closest('#tab2,#tab3')
    document.getElementById('padPaste').style.display = allowed ? 'block' : 'none'
  }

  const pasteIntoActive = async () => {
    if(!activeInput) return
    try{
      if(!navigator.clipboard || !navigator.clipboard.readText) throw new Error('clipboard-unavailable')
      const text = await navigator.clipboard.readText()
      activeInput.value = activeInput.tagName === 'TEXTAREA' ? text : text.replace(/\D/g,'')
      emitInput()
    }catch(e){
      alert('Không đọc được clipboard. Hãy cấp quyền Dán cho ứng dụng.')
    }
  }

  pad.addEventListener('click',e=>{
    const btn = e.target.closest('button')
    if(!btn || !activeInput) return

    const key = btn.dataset.key
    const action = btn.dataset.action

    if(key !== undefined){
      activeInput.value += key
      emitInput()
      return
    }

    if(action === 'paste'){
      pasteIntoActive()
    }else if(action === 'backspace'){
      activeInput.value = activeInput.value.slice(0,-1)
      emitInput()
    }else if(action === 'done'){
      const target = activeInput
      closePad()
      target.blur()
    }
  })

  document.querySelectorAll('input,textarea').forEach(e=>{
    e.setAttribute('inputmode','none')
    e.setAttribute('autocomplete','new-password')
    e.setAttribute('autocorrect','off')
    e.setAttribute('autocapitalize','off')
    e.setAttribute('spellcheck','false')
    e.setAttribute('aria-autocomplete','none')
    e.addEventListener('focus',()=>{
      activeInput = e
      pad.classList.add('open')
      updatePasteButton()
    })
    e.addEventListener('click',()=>{
      activeInput = e
      pad.classList.add('open')
      updatePasteButton()
    })
  })

  document.addEventListener('pointerdown',e=>{
    if(activeInput && !pad.contains(e.target) && e.target !== activeInput){
      closePad()
    }
  })
}
/* INIT */
setupThemeMenu();
render1();
renderGTab();
renderGXTab();
setupNumericKeyboard();
load();
loadG();
loadGX();
</script>
